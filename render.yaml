services:
  - type: web
    name: saboot
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.4
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_DIFF_MODEL
        value: gemini-3.8-flash
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
